name: Build macOS DMG

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Check Lua syntax
        run: npm run check:lua

      - name: Check shell syntax
        run: |
          bash -n install.command
          bash -n src/record.sh
          bash -n scripts/build-dmg.sh
          bash -n scripts/write-checksum.sh
          bash -n tests/test_portable_checksum.sh

      - name: Test portable checksum
        run: tests/test_portable_checksum.sh

      - name: Run native Swift tests
        run: swift test

      - name: Build and verify DMG
        run: scripts/build-dmg.sh "${GITHUB_REF_NAME}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: Discord-Voice-Hotkey-${{ github.run_id }}
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.dmg dist/*.sha256 \
            --title "Discord Voice Hotkey $GITHUB_REF_NAME" \
            --generate-notes
