name: Build macOS DMG

on:
  push:
    branches: [main, "feat/**", "fix/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check shell syntax
        run: |
          bash -n scripts/build-dmg.sh
          bash -n scripts/smoke-test-app.sh
          bash -n scripts/write-checksum.sh
          bash -n tests/test_portable_checksum.sh

      - name: Test workflow permission policy
        run: python3 tests/test_workflow_permissions.py

      - name: Test default shortcut policy
        run: python3 tests/test_default_shortcut_policy.py

      - name: Test portable checksum
        run: tests/test_portable_checksum.sh

      - name: Run native Swift tests
        run: swift test

      - name: Build and verify DMG
        run: scripts/build-dmg.sh "${GITHUB_REF_NAME}"

      - name: Launch native menu bar app
        run: scripts/smoke-test-app.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: Discord-Voice-Hotkey-${{ github.run_id }}
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified DMG artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: Discord-Voice-Hotkey-${{ github.run_id }}
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.dmg dist/*.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Discord Voice Hotkey $GITHUB_REF_NAME" \
            --generate-notes
